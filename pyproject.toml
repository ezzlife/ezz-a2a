[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezz-a2a"
version = "0.1.0"
description = "A local A2A 1.0 agent that delegates code reviews to Claude Code"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "uvicorn>=0.32,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyflakes>=3,<4"]

[tool.setuptools.packages.find]
include = ["ezz_a2a*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
